<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="#f43f5e" stroke-opacity="0.2" stroke-width="4" />
  
  <!-- Heart Shape -->
  <path d="M256 420s-150-96-150-200c0-54 44-96 96-96 32 0 60 16 74 42 14-26 42-42 74-42 52 0 96 42 96 96 0 104-150 200-150 200z"
        fill="url(#heartGradient)" filter="url(#glow)" />
        
  <!-- Microphone overlay -->
  <rect x="236" y="170" width="40" height="70" rx="20" fill="#ffffff" />
  <path d="M216 220v10c0 22 18 40 40 40s40-18 40-40v-10" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="270" x2="256" y2="305" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <line x1="230" y1="305" x2="282" y2="305" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  
  <!-- Soundwaves -->
  <path d="M190 200a50 50 0 0 0 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="6" stroke-linecap="round" />
  <path d="M322 200a50 50 0 0 1 0 50" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="6" stroke-linecap="round" />
</svg>
